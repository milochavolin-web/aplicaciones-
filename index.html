<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="app.css"><title>Grok Bot</title></head>
<body>
<div id="err" class="err" hidden></div>
<div id="stale" class="stale" hidden></div>
<main>
<section id="v-home" class="view">
  <nav class="navbar">
    <button class="avatar" data-go="account" aria-label="Account">M</button>
    <div class="brand">Grok Bot <span class="chev">›</span></div>
    <div class="nav-r"><button class="icon" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="icon bell" aria-label="Alerts"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/></svg><i id="dot" hidden></i></button></div>
  </nav>
  <div class="bal-row"><div id="odo" class="odo skel">$0.00</div><span id="badge" class="pill pill-orange">PAPER</span></div>
  <div class="pnl-row"><span id="pnl" class="pnl">—</span><span id="mult" class="pill pill-green">1.00×</span><span class="muted small">today</span></div>
  <div class="chart-wrap"><canvas id="chart"></canvas><div id="chartEmpty" class="chart-empty" hidden>Waiting for the first trade</div></div>
  <div class="ranges" id="ranges"><button data-r="LIVE" class="on">LIVE</button><button data-r="1H">1H</button><button data-r="4H">4H</button><button data-r="1D">1D</button><button data-r="1W">1W</button><button data-r="ALL">ALL</button></div>
  <div class="sec"><span>Agents · <b id="nrun">5</b> running</span></div>
  <div id="cards" class="carousel"></div>
  <div class="sec"><span>Activity</span><button class="link" data-go="activity">See all</button></div>
  <div id="act5" class="list"></div>
</section>
<section id="v-agents" class="view" hidden><h1>Agents</h1><div id="agentsFull"></div></section>
<section id="v-activity" class="view" hidden><h1>Activity</h1><div id="actAll" class="list"></div></section>
<section id="v-account" class="view" hidden><h1>Account</h1><div id="acct"></div></section>
</main>
<footer class="tabbar">
  <button data-go="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Home</button>
  <button data-go="agents"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Agents</button>
  <button data-go="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</button>
  <button data-go="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>Account</button>
</footer>
<script>window.DESK_STATIC=true</script><script src="chart.js"></script><script src="app.js"></script></body></html>
